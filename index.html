<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="保險裁判知識庫">
<meta name="theme-color" content="#08306b">
<title>保險裁判知識庫</title>
<style>
  :root{
    --blue:#08306b;        /* 深藍 主色 */
    --blue2:#0b47a1;       /* 中藍 */
    --blue-lt:#e8f0fc;     /* 淺藍底 */
    --green:#00794a;       /* 深綠 強調 */
    --green2:#00a862;      /* 亮綠 */
    --green-lt:#e3f7ed;    /* 淺綠底 */
    --bg:#ffffff;
    --panel:#f5f8fc;
    --line:#c9d6e8;
    --line-strong:#9db3d0;
    --text:#0d1b2a;        /* 近黑 高對比 */
    --muted:#41546b;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);font-size:14px;}
  #app{display:flex;height:100vh;overflow:hidden;}

  /* Sidebar */
  #sidebar{width:236px;flex:0 0 236px;background:var(--blue);color:#eaf2ff;display:flex;flex-direction:column;overflow-y:auto;}
  .brand{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:2px solid var(--green2);}
  .brand .logo{width:34px;height:34px;border-radius:8px;background:var(--green2);display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 34px;}
  .brand .titles{line-height:1.3;}
  .brand .t1{font-weight:700;font-size:15px;color:#fff;}
  .brand .t2{font-size:11px;color:#a9c8f0;}
  .nav-section{padding:10px 10px 4px;}
  .nav-label{font-size:11px;color:#8fb4e6;padding:8px 8px 4px;letter-spacing:.06em;font-weight:600;}
  .nav-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;cursor:pointer;color:#e2edfb;font-size:13.5px;}
  .nav-item:hover{background:rgba(255,255,255,.12);}
  .nav-item.active{background:var(--green2);color:#04241a;font-weight:700;}
  .nav-item .ic{width:16px;text-align:center;}
  .folder-row{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:8px;cursor:pointer;color:#e2edfb;font-size:13.5px;}
  .folder-row:hover{background:rgba(255,255,255,.12);}
  .folder-row.active{background:var(--green2);color:#04241a;font-weight:700;}
  .folder-row.active .fcount{color:#04241a;}
  .folder-row .fname{display:flex;align-items:center;gap:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .folder-row .fcount{font-size:11px;color:#a9c8f0;font-weight:600;}
  .folder-del{opacity:0;background:none;border:none;color:inherit;cursor:pointer;font-size:13px;padding:0 4px;}
  .folder-row:hover .folder-del{opacity:1;}
  .add-folder-btn{margin:6px 10px 14px;padding:8px 10px;border:1px dashed var(--green2);border-radius:8px;color:#9fe8c6;font-size:12.5px;cursor:pointer;text-align:center;font-weight:600;}
  .add-folder-btn:hover{background:var(--green2);color:#04241a;border-style:solid;}

  /* Main */
  #main{flex:1;display:flex;flex-direction:column;min-width:0;}
  #topbar{background:var(--blue2);padding:12px 20px;display:flex;gap:10px;align-items:center;border-bottom:3px solid var(--green2);}
  .search-wrap{display:flex;align-items:center;background:#fff;border-radius:8px;flex:1;max-width:640px;overflow:hidden;border:2px solid #fff;}
  .search-scope{border:none;background:var(--blue-lt);padding:9px 8px;font-size:13px;color:var(--blue);font-weight:600;border-right:1px solid var(--line);}
  #searchInput{flex:1;border:none;padding:9px 10px;font-size:13.5px;outline:none;color:var(--text);}
  .search-btn{background:var(--green);border:none;color:#fff;width:40px;height:38px;cursor:pointer;font-size:15px;}
  .search-btn:hover{background:var(--green2);}
  .top-actions{margin-left:auto;display:flex;gap:8px;}
  .pill-btn{background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.5);color:#fff;padding:8px 14px;border-radius:8px;font-size:12.5px;cursor:pointer;white-space:nowrap;font-weight:600;}
  .pill-btn:hover{background:rgba(255,255,255,.28);}
  .pill-btn.primary{background:var(--green2);border-color:var(--green2);color:#04241a;font-weight:700;}
  .pill-btn.primary:hover{background:#00c973;border-color:#00c973;}

  #filterbar{background:var(--panel);padding:12px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-bottom:2px solid var(--line);}
  .fgroup{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text);font-weight:600;}
  .fgroup input[type=date], .fgroup select{padding:7px 8px;border:1.5px solid var(--line-strong);border-radius:7px;font-size:12.5px;color:var(--text);background:#fff;font-weight:400;}
  .fgroup input[type=date]:focus, .fgroup select:focus{outline:2px solid var(--green2);border-color:var(--green2);}
  .fgroup select{min-width:110px;}
  #queryBtn{background:var(--blue);color:#fff;border:none;padding:8px 24px;border-radius:7px;font-size:13px;cursor:pointer;font-weight:700;}
  #queryBtn:hover{background:var(--blue2);}
  #resetBtn{background:#fff;color:var(--blue);border:1.5px solid var(--line-strong);padding:8px 14px;border-radius:7px;font-size:12.5px;cursor:pointer;font-weight:600;}
  #resetBtn:hover{border-color:var(--blue);}

  #content{flex:1;display:flex;min-height:0;}
  #listPane{flex:1;display:flex;flex-direction:column;min-width:0;border-right:2px solid var(--line);}
  .stat-row{padding:10px 20px;font-size:12.5px;color:var(--text);display:flex;align-items:center;justify-content:space-between;background:#fff;font-weight:600;}
  .stat-row .refresh{color:var(--green);cursor:pointer;font-weight:700;}
  .stat-row .refresh:hover{text-decoration:underline;}
  #tableWrap{flex:1;overflow:auto;padding:0 20px 16px;background:#fff;}
  table{width:100%;border-collapse:collapse;background:#fff;font-size:12.8px;}
  thead th{position:sticky;top:0;background:var(--blue);text-align:left;padding:11px 10px;color:#fff;font-weight:700;border-bottom:2px solid var(--green2);cursor:pointer;white-space:nowrap;}
  thead th:hover{background:var(--blue2);color:#9fe8c6;}
  tbody td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--text);}
  tbody tr{cursor:pointer;}
  tbody tr:nth-child(even){background:#fafcff;}
  tbody tr:hover{background:var(--green-lt);}
  tbody tr.selected{background:var(--blue-lt);box-shadow:inset 4px 0 0 var(--green2);}
  .tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
  .tag-life{background:var(--blue);color:#fff;}
  .tag-prop{background:var(--green);color:#fff;}
  .tag-auto{background:#0b47a1;color:#fff;}
  .tag-soc{background:#6b4d12;color:#fff;}
  .tag-sub{background:#5a2ea6;color:#fff;}
  .tag-none{background:#e4eaf2;color:#41546b;border:1px solid var(--line-strong);}
  .doc-badge{font-size:11px;padding:3px 8px;border-radius:5px;background:#e4eaf2;color:#1c2c40;font-weight:600;border:1px solid var(--line-strong);white-space:nowrap;display:inline-block;}
  .rel-badge{display:inline-block;margin-left:6px;font-size:10.5px;padding:2px 7px;border-radius:10px;background:var(--blue-lt);color:var(--blue2);font-weight:700;white-space:nowrap;vertical-align:middle;border:1px solid var(--blue2);cursor:pointer;}
  .rel-badge:hover{background:var(--blue2);color:#fff;}
  tr.rel-row{background:#f7f9fc;}
  tr.rel-row td{color:#5c6b80;font-size:12.5px;}
  .rel-sub{color:#5c6b80;font-style:normal;}
  .doc-badge.judg{background:var(--green-lt);color:#005936;border-color:var(--green2);}
  .caseno-link{color:var(--blue2);text-decoration:none;font-weight:700;}
  tbody tr:hover .caseno-link{text-decoration:underline;}
  .star{cursor:pointer;color:#9db3d0;font-size:16px;}
  .star:hover{color:var(--green2);}
  .star.on{color:#e8a300;}
  .result-cell{color:var(--text);max-width:260px;line-height:1.6;}
  .no-results{padding:60px 20px;text-align:center;color:var(--muted);font-weight:600;}

  /* Detail panel */
  #detailPane{width:410px;flex:0 0 410px;background:#fff;overflow-y:auto;padding:20px;}
  #detailPane.empty{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;}
  .d-title{font-size:15.5px;font-weight:700;color:var(--blue);margin-bottom:2px;}
  .d-sub{font-size:12px;color:var(--muted);margin-bottom:14px;font-weight:600;}
  .d-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
  .d-section{margin-bottom:18px;}
  .d-h{font-size:12.5px;font-weight:700;color:var(--blue);display:flex;align-items:center;gap:6px;margin-bottom:8px;}
  .d-h .bar{width:4px;height:14px;background:var(--green2);border-radius:2px;}
  .d-body{font-size:13px;line-height:1.8;color:var(--text);background:var(--panel);border-radius:8px;padding:12px 13px;border:1.5px solid var(--line);}
  .d-body.plain{background:var(--green-lt);border-color:var(--green2);}
  .d-link{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font-size:13px;color:#fff;background:var(--blue2);padding:9px 14px;border-radius:7px;text-decoration:none;font-weight:700;}
  .d-link:hover{background:var(--blue);}
  .d-note{font-size:12px;color:var(--text);background:var(--blue-lt);padding:10px 12px;border-radius:7px;border:1px solid var(--line);line-height:1.6;}
  .dispute-tag{display:inline-block;font-size:11.5px;font-weight:700;color:#7c3aed;background:#f3e8ff;border:1px solid #d8b4fe;border-radius:20px;padding:4px 10px;margin:2px 4px 2px 0;}
  .close-detail{float:right;background:var(--panel);border:1px solid var(--line-strong);border-radius:6px;color:var(--blue);font-size:14px;cursor:pointer;width:26px;height:26px;font-weight:700;}
  .close-detail:hover{background:var(--blue);color:#fff;}

  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:var(--panel);}
  ::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:5px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--blue2);}
  #modalBg{position:fixed;inset:0;background:rgba(8,48,107,.55);display:none;align-items:center;justify-content:center;z-index:50;}
  #modalBg.show{display:flex;}
  #modalBox{background:#fff;border-radius:12px;padding:24px;width:360px;border-top:5px solid var(--green2);}
  #modalBox h3{margin:0 0 14px;font-size:15.5px;color:var(--blue);}
  #modalBox input{width:100%;padding:10px 11px;border:1.5px solid var(--line-strong);border-radius:7px;font-size:13px;margin-bottom:16px;color:var(--text);}
  #modalBox input:focus{outline:2px solid var(--green2);border-color:var(--green2);}
  #modalBox .row{display:flex;gap:8px;justify-content:flex-end;}
  #modalBox button{padding:9px 16px;border-radius:7px;border:none;font-size:12.5px;cursor:pointer;font-weight:700;}
  #modalBox .cancel{background:#e4eaf2;color:var(--blue);}
  #modalBox .ok{background:var(--green);color:#fff;}
  #modalBox .ok:hover{background:var(--green2);}

  /* ===== Mobile responsive ===== */
  #hamburgerBtn{display:none;background:none;border:none;color:#fff;font-size:20px;cursor:pointer;padding:4px 8px;margin-right:4px;flex:0 0 auto;}
  #sidebarBackdrop{display:none;}

  @media (max-width: 860px){
    body{font-size:15px;}
    #hamburgerBtn{display:block;}
    #app{display:block;height:auto;min-height:100vh;overflow:visible;}
    #sidebar{position:fixed;top:0;left:-270px;bottom:0;width:250px;z-index:60;transition:left .22s ease;box-shadow:2px 0 18px rgba(0,0,0,.35);}
    #sidebar.open{left:0;}
    #sidebarBackdrop.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55;}
    #main{min-height:100vh;}
    #topbar{padding:10px 12px;flex-wrap:wrap;}
    .search-wrap{order:3;width:100%;max-width:none;margin-top:8px;}
    .top-actions{gap:6px;}
    .pill-btn{padding:8px 10px;font-size:12px;}
    #filterbar{padding:10px 12px;gap:10px;}
    .fgroup{width:100%;justify-content:space-between;}
    .fgroup select, .fgroup input[type=date]{flex:1;min-width:0;}
    #queryBtn, #resetBtn{flex:1;}
    #content{display:block;}
    #listPane{border-right:none;}
    #tableWrap{padding:0 10px 12px;overflow:visible;}
    thead{display:none;}
    table, tbody, tbody tr, tbody td{display:block;width:100%;}
    tbody tr{border:1px solid var(--line-strong);border-radius:10px;margin-bottom:12px;padding:10px 12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.06);}
    tbody tr:nth-child(even){background:#fff;}
    tbody td{padding:5px 0;border-bottom:none;}
    tbody td[data-label]:before{content:attr(data-label);display:block;font-size:10.5px;font-weight:700;color:var(--blue2);letter-spacing:.03em;margin-bottom:2px;}
    tbody td.mobile-hide{display:none;}
    #detailPane{display:none;}
    #detailPane.mobile-open{display:block;position:fixed;inset:0;z-index:70;background:#fff;overflow-y:auto;padding:18px 16px 40px;}
    #detailPane.empty{display:none !important;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="sidebarBackdrop"></div>
  <div id="sidebar">
    <div class="brand">
      <div class="logo">⚖️</div>
      <div class="titles">
        <div class="t1">保險裁判知識庫</div>
        <div class="t2">台灣保險裁判研究庫</div>
      </div>
    </div>

    <div class="nav-section">
      <div class="nav-label">資料庫</div>
      <div class="nav-item active" data-view="search"><span class="ic">🔍</span>裁判檢索</div>
      <div class="nav-item" data-view="all"><span class="ic">▦</span>裁判書閱覽</div>
      <div class="nav-item" data-view="bookmarks"><span class="ic">☆</span>我的書籤</div>
    </div>

    <div class="nav-section">
      <div class="nav-label">下載管理</div>
      <div class="nav-item" id="downloadBtn"><span class="ic">⬇</span>下載目前清單</div>
      <div class="nav-item" id="statsBtn"><span class="ic">ⓘ</span>資料庫說明</div>
    </div>

    <div class="nav-section" style="flex:1;">
      <div class="nav-label" style="display:flex;align-items:center;justify-content:space-between;padding-right:8px;">
        <span>我的資料夾</span>
      </div>
      <div id="folderList"></div>
      <div class="add-folder-btn" id="addFolderBtn">＋ 新增自訂資料夾</div>
    </div>

    <div class="nav-section">
      <div class="nav-label">資料夾分類（系統）</div>
      <div class="folder-row" data-preset="all"><span class="fname">📁 保險相關（全部）</span><span class="fcount"></span></div>
      <div class="folder-row" data-preset="life"><span class="fname">📁 人身保險</span><span class="fcount"></span></div>
      <div class="folder-row" data-preset="prop"><span class="fname">📁 財產保險</span><span class="fcount"></span></div>
      <div class="folder-row" data-preset="auto"><span class="fname">📁 汽車保險</span><span class="fcount"></span></div>
      <div class="folder-row" data-preset="subrog"><span class="fname">📁 代位求償</span><span class="fcount"></span></div>
      <div class="folder-row" data-preset="social"><span class="fname">📁 社會保險</span><span class="fcount"></span></div>
      <div class="folder-row" data-preset="todo"><span class="fname">📁 待分類</span><span class="fcount"></span></div>
    </div>
  </div>

  <div id="main">
    <div id="topbar">
      <button id="hamburgerBtn" aria-label="開啟選單">☰</button>
      <div class="search-wrap">
        <select class="search-scope" id="searchScope">
          <option value="all">全文</option>
          <option value="caseno">案號</option>
          <option value="court">法院</option>
          <option value="cause">爭點</option>
        </select>
        <input id="searchInput" placeholder="請輸入關鍵字、案號、法院、保險類型或爭點">
        <button class="search-btn" id="searchBtn">🔍</button>
      </div>
      <div class="top-actions">
        <button class="pill-btn" id="historyBtn">檢索歷史</button>
        <button class="pill-btn" id="bookmarkNavBtn">☆ 我的書籤</button>
        <button class="pill-btn primary" id="topDownloadBtn">⬇ 下載裁判</button>
      </div>
    </div>

    <div id="filterbar">
      <div class="fgroup">裁判日期
        <input type="date" id="dateFrom"> ~ <input type="date" id="dateTo">
      </div>
      <div class="fgroup">保險類型
        <select id="catFilter">
          <option value="">全部</option>
          <option value="人壽/意外/健康">人身保險（人壽/意外/健康）</option>
          <option value="財產保險">財產保險</option>
          <option value="汽車保險">汽車保險</option>
          <option value="代位求償">代位求償</option>
          <option value="社會保險">社會保險（勞保／健保等）</option>
          <option value="個人保險糾紛">個人保險糾紛（非保險公司被告）</option>
          <option value="待分類">待分類</option>
        </select>
      </div>
      <div class="fgroup">文件類型
        <select id="docFilter">
          <option value="">全部</option>
          <option value="判決">判決</option>
          <option value="裁定">裁定</option>
        </select>
      </div>
      <div class="fgroup">爭議類型
        <select id="disputeFilter">
          <option value="">全部</option>
          <option value="招攬爭議">招攬爭議</option>
          <option value="告知義務違反">告知義務違反</option>
          <option value="時效抗辯">時效抗辯</option>
          <option value="除外條款／不保事故">除外條款／不保事故</option>
          <option value="契約解除／停效復效">契約解除／停效復效</option>
          <option value="複保險／代位求償">複保險／代位求償</option>
          <option value="受益人／繼承人認定">受益人／繼承人認定</option>
          <option value="詐欺／偽造／道德危險">詐欺／偽造／道德危險</option>
          <option value="給付範圍／金額爭議">給付範圍／金額爭議</option>
          <option value="強制汽車責任保險／第三人求償">強制汽車責任保險／第三人求償</option>
          <option value="保費爭議">保費爭議</option>
          <option value="理賠程序／文件爭議">理賠程序／文件爭議</option>
        </select>
      </div>
      <button id="queryBtn">查詢</button>
      <button id="resetBtn">重設</button>
    </div>

    <div id="content">
      <div id="listPane">
        <div class="stat-row">
          <span id="statText">共 0 筆裁判</span>
          <span class="refresh" id="refreshBtn">↺ 重新整理</span>
        </div>
        <div id="tableWrap">
          <table>
            <thead>
              <tr>
                <th data-k="date">裁判日期</th>
                <th data-k="court">法院</th>
                <th data-k="caseno">案號</th>
                <th data-k="category">保險類型</th>
                <th data-k="cause">爭點</th>
                <th>結果摘要</th>
                <th data-k="doctype">文件類型</th>
                <th>☆</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
          <div class="no-results" id="noResults" style="display:none;">查無符合條件的裁判書</div>
        </div>
      </div>

      <div id="detailPane" class="empty">從左側清單點選一筆裁判以檢視詳情</div>
    </div>
  </div>
</div>

<div id="modalBg">
  <div id="modalBox">
    <h3>新增自訂資料夾</h3>
    <input id="folderNameInput" placeholder="資料夾名稱，例如：客戶 周XX">
    <select id="folderParentSelect" style="width:100%;margin-top:8px;padding:8px;border-radius:6px;border:1px solid var(--line-strong);font-size:13px;">
      <option value="">－ 無（頂層資料夾）－</option>
    </select>
    <div class="row">
      <button class="cancel" id="modalCancel">取消</button>
      <button class="ok" id="modalOk">建立（套用目前篩選條件）</button>
    </div>
  </div>

: "財產保險", "note": "", "digest": "臺灣高雄地方法院 112 年度海商字第 9 號民事判決\n裁判日期：民國 114 年 02 月 18 日\n裁判案由：給付保險金等\n\n原告 陳成娣\n被告 旺旺友聯產物保險股份有限公司、兆豐產物保險股份有限公司、龍鴻航業股份有限公司、高旗旅行社股份有限公司\n\n主 文\n原告關於追加高旗旅行社股份有限公司之訴駁回。\n\n案情摘要：\n本案為旅行社責任保險（發展觀光條例第31條規範之旅行業履約保證/責任保險）理賠爭議之程序性判決。原告原對產險公司請求給付保險金，後追加「代位債務人（旅行社）」之權利向產險公司求償，並將旅行社列為共同被告。法院認定原告既係代位旅行社行使對保險公司之權利（法定訴訟擔當），即不得再將被代位人（旅行社）列為共同被告，故就此部分追加之訴駁回（本案主要理賠爭議部分另案審理中）。\n\n判決結果：程序駁回（僅駁回追加旅行社為被告部分，非實體理賠爭議之終局判決）。\n\n資料來源：https://judgment.judicial.gov.tw/FJUD/data.aspx?ty=JD&id=KSDV%2c112%2c%e6%b5%b7%e5%95%86%2c9%2c20250218%2c1&ot=in\n", "officialUrl": "https://judgment.judicial.gov.tw/FJUD/data.aspx?ty=JD&id=KSDV%2C112%2C%E6%B5%B7%E5%95%86%2C9%2C20250218%2C1&ot=in", "related": [], "laws": [], "disputeTypes": ["複保險／代位求償"]}, {"idx": "498", "court": "臺灣臺北地方法院", "caseno": "114年度保險小上字第2號", "doctype": "民事判決", "date": "114.02.18", "cause": "給付保險金", "is_judgment": "是", "category": "財產保險", "note": "被告：和泰產物保險股份有限公司", "digest": "主文：一、上訴駁回。二、第二審訴訟費用新臺幣貳仟貳佰伍拾元由上訴人負擔。", "officialUrl": "https://judgment.judicial.gov.tw/FJUD/data.aspx?ty=JD&id=TPDV%2C114%2C%E4%BF%9D%E9%9A%AA%E5%B0%8F%E4%B8%8A%2C2%2C20250218%2C1&ot=in", "related": [], "laws": [], "disputeTypes": []}, {"idx": "499", "court": "臺灣高等法院", "caseno": "113年度保險上字第21號", "doctype": "民事判決", "date": "114.02.18", "cause": "解除保險契約", "is_judgment": "是", "category": "人壽/意外/健康", "note": "被告：國泰人壽保險股份有限公司", "digest": "主文：上訴駁回。第二審訴訟費用由上訴人負擔；參加訴訟費用由參加人負擔。", "officialUrl": "https://judgment.judicial.gov.tw/FJUD/data.aspx?ty=JD&id=TPHV%2C113%2C%E4%BF%9D%E9%9A%AA%E4%B8%8A%2C21%2C20250218%2C2&ot=in", "related": [], "laws": [], "disputeTypes": []}, {"idx": "500", "court": "臺灣橋頭地方法院", "caseno": "113年度保險小上字第1號", "doctype": "民事判決", "date": "114.02.17", "cause": "給付保險金", "is_judgment": "是", "category": "人壽/意外/健康", "note": "被告：南山人壽保險股份有限公司", "digest": "主文：上訴駁回。第二審訴訟費用新臺幣壹仟陸佰陸拾伍元由上訴人負擔。理由一、按對於小額程序之第一審判決提起上訴，非以其違背法令為理由，不得為之；所謂判決違背法令，乃指判決不適用法規或適用不當，或有民事訴訟法第469條所列第1款至第5款事由，其判決當然為違背法令，民事訴訟法第436條之24第2項、第436條之32第2項準用第468條及第469條第1款至第5款分別定有明 function dateToISO(d){ // "115.07.09" -> "2026-07-09"
  const m = d.match(/^(\d+)\.(\d+)\.(\d+)$/);
  if(!m) return "";
  const y = parseInt(m[1],10)+1911;
  return `${y}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
}

function catTag(cat){
  if(cat === "人壽/意外/健康") return '<span class="tag tag-life">人身保險</span>';
  if(cat === "財產保險") return '<span class="tag tag-prop">財產保險</span>';
  if(cat === "汽車保險") return '<span class="tag tag-auto">汽車保險</span>';
  if(cat === "代位求償") return '<span class="tag tag-sub">代位求償</span>';
  if(cat === "社會保險") return '<span class="tag tag-soc">社會保險</span>';
  return '<span class="tag tag-none">待分類</span>';
}

function cleanDigest(t){
  if(!t) return "";
  let s = String(t);
  // 移除「資料來源：<網址>」整段（含全形/半形冒號）
  s = s.replace(/資料來源\s*[：:]\s*https?:\/\/\S+/g, "");
  // 移除任何殘留的裸網址
  s = s.replace(/https?:\/\/\S+/g, "");
  // 收尾清理：多餘空白與尾端標點
  s = s.replace(/\s{2,}/g, " ").replace(/[\s、，,。\-–—|]+$/g, "").trim();
  return s;
}

function shortResult(d){
  const dg = cleanDigest(d.digest).replace(/^主文[：:]\s*/, "");
  if(dg){
    const m = dg.match(/判決結果[：:]\s*([^\n]+)/);
    if(m) return cleanDigest(m[1]);
    return dg.slice(0,40) + (dg.length>40 ? "…" : "");
  }
  if(d.is_judgment && d.is_judgment.startsWith("否")){
    return "程序性裁定，非實體判決結果";
  }
  return "尚未下載摘要，請點官方連結查看全文";
}

  if(preset === "auto") return row.category === "汽車保險";
  if(preset === "subrog") return row.category === "代位求償";
  if(preset === "social") return row.category === "社會保險";
  if(preset === "todo") return row.category === "待分類";
  const folders = loadFolders();
  const f = folders.find(x=>x.id===preset);
  if(!f) return true;
  return matchFilter(row, f.filter);
}

function matchFilter(row, f){
  if(!f) return true;
  if(f.cat && row.category !== f.cat) return false;
  if(f.doc && row.doctype.indexOf(f.doc) === -1) return false;
  if(f.q){
    const hay = (row.court+row.caseno+row.cause+row.digest).toLowerCase();
    if(hay.indexOf(f.q.toLowerCase()) === -1) return false;
  }
  return true;
}

function getFiltered(){
  const bookmarks = loadBookmarks();
  return DATA.filter(row=>{
    if(state.preset === "bookmarks"){
      if(bookmarks.indexOf(row.idx) === -1) return false;
    } else if(!applyPreset(row, state.preset)){
      return false;
    }
    if(state.cat && state.cat !== "__ANY__"){
      if(row.category !== state.cat) return false;
    }
    if(state.doc && row.doctype.indexOf(state.doc) === -1) return false;
    if(state.dispute){
      const dt = Array.isArray(row.disputeTypes) ? row.disputeTypes : [];
      if(dt.indexOf(state.dispute) === -1) return false;
    }
    const iso = dateToISO(row.date);
    if(state.dateFrom && iso && iso < state.dateFrom) return false;
    if(state.dateTo && iso && iso > state.dateTo) return false;
    if(state.q){
      const scope = state.scope;
      const qq = state.q.toLowerCase();
      let hay = "";
      if(scope==="all") hay = row.court+row.caseno+row.cause+row.digest+row.category;
      else if(scope==="caseno") hay = row.caseno;
      else if(scope==="court") hay = row.court;
      else if(scope==="cause") hay = row.cause;
      if(hay.toLowerCase().indexOf(qq) === -1) return false;
    }
    return true;
  });
}

function sortRows(rows){
  const k = state.sortKey, dir = state.sortDir === "asc" ? 1 : -1;
  return rows.slice().sort((a,b)=>{
    let av = a[k]||"", bv = b[k]||"";
    if(k === "date"){ av = dateToISO(a.date); bv = dateToISO(b.date); }
    if(av < bv) return -1*dir;
    if(av > bv) return 1*dir;
    return 0;
  });
}

function caseKeyFromUrl(url){
  try{
    const q = url.split("id=")[1].split("&")[0];
    return decodeURIComponent(q);
  }catch(e){ return null; }
}

const GROUP_COLORS = ["#0b47a1","#00794a","#c2410c","#7c3aed","#be185d","#0891b2","#a16207","#4d7c0f","#b91c1c","#0f766e","#9333ea","#ca8a04"];
function groupColor(gkey){
  let h = 0;
  const s = String(gkey);
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; }
  return GROUP_COLORS[h % GROUP_COLORS.length];
}

let _groupCache = null;
function computeGroups(){
  // 依司法院「歷審裁判」關聯表（GetJudHistory.ashx）建立同一案件不同審級的分組，
  // related 欄位存放該筆判決關聯到的其他判決識別碼（與 officialUrl 的 id 參數格式相同）。
  if(_groupCache) return _groupCache;
  const keyToIdx = {};
  DATA.forEach(r=>{ const k = caseKeyFromUrl(r.officialUrl); if(k) keyToIdx[k] = r.idx; });
  const parent = {};
  DATA.forEach(r=>{ parent[r.idx] = r.idx; });
  function find(x){ while(parent[x] !== x){ x = parent[x]; } return x; }
  function union(a,b){ const ra=find(a), rb=find(b); if(ra!==rb) parent[ra]=rb; }
  DATA.forEach(r=>{
    if(Array.isArray(r.related)){
      r.related.forEach(rk=>{
        const otherIdx = keyToIdx[rk];
        if(otherIdx && otherIdx !== r.idx) union(r.idx, otherIdx);
      });
    }
  });
  const groups = {};
  DATA.forEach(r=>{ const root = find(r.idx); (groups[root] = groups[root] || []).push(r.idx); });
  const idxToGroup = {};
  DATA.forEach(r=>{ idxToGroup[r.idx] = groups[find(r.idx)]; });
  _groupCache = idxToGroup;
  return idxToGroup;
}

function render(){
  renderFolders();
  const filtered = sortRows(getFiltered());
  document.getElementById("statText").textContent = `共 ${filtered.length} 筆裁判（資料庫總計 ${DATA.length} 筆，最後更新：${LAST_UPDATE}）`;
  const tbody = document.getElementById("tbody");
  const bookmarks = loadBookmarks();
  if(filtered.length === 0){
    tbody.innerHTML = "";
    document.getElementById("noResults").style.display = "block";
  } else {
    document.getElementById("noResults").style.display = "none";
    const groupMap = computeGroups();
    const filteredIdxSet = new Set(filtered.map(r=>r.idx));
    const rendered = new Set();
    const ordered = [];
    filtered.forEach(row=>{
      if(rendered.has(row.idx)) return;
      const groupIdxs = (groupMap[row.idx] || [row.idx]).filter(i=>filteredIdxSet.has(i));
      const groupRows = groupIdxs.map(i=>DATA.find(d=>d.idx===i)).filter(Boolean);
      groupRows.sort((a,b)=> dateToISO(a.date) < dateToISO(b.date) ? -1 : (dateToISO(a.date) > dateToISO(b.date) ? 1 : 0));
      const gkey = groupRows[0].idx;
      const expanded = state.expandedGroups.has(gkey);
      groupRows.forEach((gr, gi)=>{
        if(gi>0 && !expanded){ rendered.add(gr.idx); return; }
        ordered.push({ row: gr, depth: gi===0?0:1, groupSize: groupRows.length, gkey, expanded });
        rendered.add(gr.idx);
      });
    });
    tbody.innerHTML = ordered.map(({row, depth, groupSize, gkey, expanded})=>{
      const star = bookmarks.indexOf(row.idx) > -1 ? "star on" : "star";
      const docBadge = row.doctype.indexOf("判決")>-1 ? "doc-badge judg" : "doc-badge";
      const isGrouped = groupSize > 1;
      const color = isGrouped ? groupColor(gkey) : null;
      const linkBadge = (depth===0 && isGrouped)
        ? `<button class="rel-badge" data-toggle-group="${gkey}" style="background:${color}22;color:${color};border-color:${color};" title="偵測到 ${groupSize} 筆同一案件不同審級的判決，點擊${expanded?'收合':'展開'}">${expanded?'▾':'▸'} 同案歷審 ${groupSize} 筆</button>`
        : "";
      const caseCell = depth>0
        ? `<span class="caseno-link rel-sub">└ ${row.caseno}</span>`
        : `<span class="caseno-link">${row.caseno}</span>${linkBadge}`;
      const rowStyle = isGrouped ? `style="border-left:4px solid ${color};"` : "";
      return `<tr data-idx="${row.idx}" class="${state.selectedIdx===row.idx?'selected':''} ${depth>0?'rel-row':''}" ${rowStyle}>
        <td data-label="裁判日期">${row.date}</td>
        <td data-label="法院">${row.court}</td>
        <td data-label="案號">${caseCell}</td>
        <td data-label="保險類型">${catTag(row.category)}</td>
        <td data-label="爭點">${row.cause}${Array.isArray(row.disputeTypes) && row.disputeTypes.length ? `<br>${row.disputeTypes.map(t=>`<span class="dispute-tag" style="font-size:10px;padding:2px 7px;margin-top:3px;">${t}</span>`).join("")}` : ""}</td>
        <td class="result-cell" data-label="結果摘要">${shortResult(row)}</td>
        <td data-label="文件類型"><span class="${docBadge}">${row.doctype}</span></td>
        <td data-label="書籤"><span class="${star}" data-star="${row.idx}">★</span></td>
      </tr>`;
    }).join("");
    document.querySelectorAll("[data-toggle-group]").forEach(btn=>{
      btn.onclick = (e)=>{
        e.stopPropagation();
        const k = btn.getAttribute("data-toggle-group");
        if(state.expandedGroups.has(k)) state.expandedGroups.delete(k);
        else state.expandedGroups.add(k);
        render();
      };
    });
  }
  renderDetail();
}

function renderDetail(){
  const pane = document.getElementById("detailPane");
  if(!state.selectedIdx){
    pane.className = "empty";
    pane.innerHTML = "從左側清單點選一筆裁判以檢視詳情";
    return;
  }
  const row = DATA.find(r=>r.idx===state.selectedIdx);
  if(!row){ pane.className="empty"; pane.innerHTML="找不到資料"; return; }
  pane.className = "mobile-open";
  const bookmarks = loadBookmarks();
  const isBm = bookmarks.indexOf(row.idx) > -1;
  const cleaned = cleanDigest(row.digest).replace(/^主文[：:]\s*/, "");
  const plain = cleaned ? cleaned : "本筆裁判尚未下載摘要。點擊下方官方連結可前往司法院原始頁面查看全文，或使用左側「下載裁判」功能。";
  pane.innerHTML = `
    <button class="close-detail" id="closeDetail">✕</button>
    <div class="d-title">${row.court}</div>
    <div class="d-sub">${row.caseno}　|　${row.date}　|　${row.doctype}</div>
    <div class="d-meta">${catTag(row.category)}<span class="doc-badge">${row.is_judgment}</span></div>

    <div class="d-section">
      <div class="d-h"><span class="bar"></span>主文預覽</div>
      <div class="d-body plain">${plain}</div>
    </div>

    <div class="d-section">
      <div class="d-h"><span class="bar"></span>爭點 / 裁判案由</div>
      <div class="d-body">${row.cause}</div>
    </div>

    <div class="d-section">
      <div class="d-h"><span class="bar"></span>當事人 / 分類依據</div>
      <div class="d-note">分類：${row.category||"未分類（程序性文書或尚未人工歸類）"}${row.note ? " ｜ 備註："+row.note : ""}</div>
    </div>

    ${Array.isArray(row.disputeTypes) && row.disputeTypes.length ? `
    <div class="d-section">
      <div class="d-h"><span class="bar"></span>爭議類型</div>
      <div class="d-note">${row.disputeTypes.map(t=>`<span class="dispute-tag">${t}</span>`).join("")}</div>
    </div>` : ""}

    ${Array.isArray(row.laws) && row.laws.length ? `
    <div class="d-section">
      <div class="d-h"><span class="bar"></span>相關法條</div>
      <div class="d-note">${row.laws.map(l=>`<div>・${l}</div>`).join("")}</div>
    </div>` : ""}

    <a class="d-link" href="${row.officialUrl}" target="_blank" rel="noopener">↗ 前往司法院官方全文頁面</a>
    <br>
    <button class="pill-btn" style="margin-top:14px;background:${isBm?'#e8a300':'var(--panel)'};color:${isBm?'#fff':'var(--blue)'};border:1.5px solid ${isBm?'#e8a300':'var(--line-strong)'};" id="toggleBookmark">${isBm?'★ 已加入書籤':'☆ 加入書籤'}</button>
  `;
  document.getElementById("closeDetail").onclick = ()=>{ state.selectedIdx=null; render(); };
  document.getElementById("toggleBookmark").onclick = ()=>{
    let bm = loadBookmarks();
    if(bm.indexOf(row.idx)>-1) bm = bm.filter(x=>x!==row.idx);
    else bm.push(row.idx);
    saveBookmarks(bm);
    render();
  };
}

function folderCount(f, folders){
  const own = DATA.filter(r=>matchFilter(r, f.filter)).length;
  const kids = folders.filter(x=>x.parentId===f.id);
  if(!kids.length) return own;
  const kidSum = kids.reduce((s,k)=>s+folderCount(k, folders), 0);
  return own + kidSum;
}

function renderFolderNode(f, folders, depth){
  const indent = 14 + depth*16;
  const kids = folders.filter(x=>x.parentId===f.id);
  const count = folderCount(f, folders);
  let html = `<div class="folder-row ${state.preset===f.id?'active':''}" data-preset="${f.id}" style="padding-left:${indent}px;">
      <span class="fname">${depth>0?'└ ':'📁 '}${f.name}</span>
      <span class="fcount">${count}<button class="folder-add-sub" data-addsub="${f.id}" title="新增子資料夾">＋</button><button class="folder-del" data-del="${f.id}">✕</button></span>
    </div>`;
  kids.forEach(k=>{ html += renderFolderNode(k, folders, depth+1); });
  return html;
}

function renderFolders(){
  const folders = loadFolders();
  const list = document.getElementById("folderList");
  const topLevel = folders.filter(f=>!f.parentId);
  list.innerHTML = topLevel.map(f=>renderFolderNode(f, folders, 0)).join("");
  document.querySelectorAll("#folderList [data-preset]").forEach(el=>{
    el.onclick = (e)=>{
      if(e.target.closest("[data-del]") || e.target.closest("[data-addsub]")) return;
      state.preset = el.getAttribute("data-preset");
      state.selectedIdx = null;
      render();
    };
  });
  document.querySelectorAll("#folderList [data-del]").forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const id = el.getAttribute("data-del");
      const all = loadFolders();
      const idsToDelete = new Set([id]);
      let changed = true;
      while(changed){
        changed = false;
        all.forEach(f=>{ if(f.parentId && idsToDelete.has(f.parentId) && !idsToDelete.has(f.id)){ idsToDelete.add(f.id); changed = true; } });
      }
      const remaining = all.filter(f=>!idsToDelete.has(f.id));
      saveFolders(remaining);
      if(idsToDelete.has(state.preset)){ state.preset="all"; }
      render();
    };
  });
  document.querySelectorAll("#folderList [data-addsub]").forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      openFolderModal(el.getAttribute("data-addsub"));
    };
  });
  document.querySelectorAll(".nav-section .folder-row[data-preset]").forEach(el=>{
    const preset = el.getAttribute("data-preset");
    if(["all","life","prop","auto","subrog","social","todo"].indexOf(preset) === -1) return;
    el.classList.toggle("active", state.preset===preset);
    const cnt = DATA.filter(r=>applyPreset(r, preset)).length;
    el.querySelector(".fcount").textContent = cnt;
    el.onclick = ()=>{ state.preset = preset; state.selectedIdx=null; render(); };
  });
}

function downloadCurrent(){
  const rows = sortRows(getFiltered());
  const header = ["序號","法院","案號","裁判類型","裁判日期","保險類型","裁判案由","是否為實體判決","摘要","官方連結"];
  const csvRows = [header.join(",")];
  rows.forEach(r=>{
    const line = [r.idx,r.court,r.caseno,r.doctype,r.date,r.category,r.cause,r.is_judgment,cleanDigest(r.digest).replace(/[\r\n,]/g," "),r.officialUrl];
    csvRows.push(line.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(","));
  });
  const blob = new Blob(["﻿"+csvRows.join("\r\n")], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "保險裁判清單_"+(new Date().toISOString().slice(0,10))+".csv";
  a.click();
  URL.revokeObjectURL(url);
}

};

  th.onclick = ()=>{
    const k = th.getAttribute("data-k");

});

  const starEl = e.target.closest("[data-star]");
  if(starEl){
    const idx = starEl.getAttribute("data-star");

document.querySelectorAll(".nav-item[data-view]").forEach(el=>{
  el.onclick = ()=>{
    document.querySelectorAll(".nav-item[data-view]").forEach(x=>x.classList.remove("active"));
    el.classList.add("active");

    if(v==="bookmarks"){ state.preset="bookmarks"; }
    else { state.preset="all"; }
    state.selectedIdx = null;
    render();
  };
});

// Add folder modal
function openFolderModal(presetParentId){
  document.getElementById("folderNameInput").value = "";
  const sel = document.getElementById("folderParentSelect");
  const folders = loadFolders();
  sel.innerHTML = '<option value="">－ 無（頂層資料夾）－</option>' +
    folders.filter(f=>!f.parentId).map(f=>`<option value="${f.id}">${f.name}</option>`).join("");
  if(presetParentId) sel.value = presetParentId;
  document.getElementById("modalBg").classList.add("show");
}
document.getElementById("addFolderBtn").onclick = ()=> openFolderModal(null);
document.getElementById("modalCancel").onclick = ()=> document.getElementById("modalBg").classList.remove("show");
document.getElementById("modalOk").onclick = ()=>{
  const name = document.getElementById("folderNameInput").value.trim();
  if(!name){ alert("請輸入資料夾名稱"); return; }
  const parentId = document.getElementById("folderParentSelect").value || null;
  const folders = loadFolders();
  const id = "custom_"+Date.now();
  folders.push({
    id, name, parentId,
    filter: {
      cat: document.getElementById("catFilter").value,
      doc: document.getElementById("docFilter").value,
      q: document.getElementById("searchInput").value.trim()
    }
  });
  saveFolders(folders);
  document.getElementById("modalBg").classList.remove("show");
  state.preset = id;
  render();
};
document.getElementById("modalBg").addEventListener("click", (e)=>{
  if(e.target.id==="modalBg") document.getElementById("modalBg").classList.remove("show");
});
